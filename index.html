<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>Social Image Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

  <div id="app">

    <div id="canvas-wrapper">
      <!-- Spacer gives the wrapper its scroll height; sized by JS -->
      <div id="canvas-spacer"></div>
      <div id="scale-indicator"></div>
      <button id="mobile-open-btn">&#9776;&ensp;Options</button>
      <div id="canvas">

        <!-- Ghost: image overflow shown at 20% opacity, excluded from export -->
        <img id="image-ghost" data-html2canvas-ignore alt="">

        <!-- Layer 1: Image (bottom) -->
        <canvas id="image-layer"></canvas>

        <!-- Layer 2: Gradient (middle) -->
        <div id="gradient-layer"></div>

        <!-- Layer 3: Headline text -->
        <div id="text-layer">
          <p id="headline-display"></p>
        </div>

        <!-- Layer 4: Watermark (top) -->
        <div id="watermark-layer">
          <img id="watermark-img" src="https://cdn.mos.cms.futurecdn.net/fDRfpLwbDo4YTNyaG3xyrf.png" crossorigin="anonymous" alt="Watermark">
        </div>

        <!-- Layer 4b: Secondary watermark — off by default -->
        <div id="watermark2-layer">
          <img id="watermark2-img" src="https://cdn.mos.cms.futurecdn.net/sW6rc26SD5UmPrBCgWHfP3.png" crossorigin="anonymous" alt="Secondary watermark">
        </div>

        <!-- Layer 4c: Third watermark — off by default -->
        <div id="watermark3-layer">
          <img id="watermark3-img" src="https://cdn.mos.cms.futurecdn.net/fko79tmMy6qTroLb6KpiP3.png" crossorigin="anonymous" alt="Third watermark">
        </div>

        <!-- Layer 5: Drag/resize handles (corners only — proportional scale) -->
        <div id="image-handles" class="hidden">
          <div id="selection-border"></div>
          <div class="handle tl" data-handle="tl"></div>
          <div class="handle tr" data-handle="tr"></div>
          <div class="handle bl" data-handle="bl"></div>
          <div class="handle br" data-handle="br"></div>
        </div>

      </div>
    </div>

    <div id="sheet-backdrop"></div>

    <aside id="controls">
      <div id="sheet-handle"><div id="sheet-handle-bar"></div></div>
      <h1>Create Your Post</h1>

      <section class="control-group">
        <label>Photo</label>
        <button id="upload-btn">Upload from computer</button>
        <input type="file" id="file-input" accept="image/*" hidden>
        <div class="url-row">
          <input type="text" id="url-input" placeholder="Or paste an image URL…">
          <button id="url-btn">Load</button>
        </div>
        <button id="remove-btn" style="display:none">Remove Image</button>
        <button id="undo-btn" disabled>Undo</button>
        <p class="hint">Drag to reposition. Pull corners to resize.</p>
      </section>

      <section class="control-group">
        <label for="headline-input">Headline</label>
        <textarea id="headline-input" placeholder="Enter your headline here…" rows="5"></textarea>
      </section>

      <section class="control-group">
        <label>Watermarks</label>
        <div class="toggle-row">
          <label>Main</label>
          <label class="toggle">
            <input type="checkbox" id="watermark-toggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <label>Arrows</label>
          <label class="toggle">
            <input type="checkbox" id="watermark2-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <label>Buyer's Guide</label>
          <label class="toggle">
            <input type="checkbox" id="watermark3-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </section>

      <section class="control-group">
        <button id="export-btn" class="primary">Download Image</button>
      </section>
    </aside>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
